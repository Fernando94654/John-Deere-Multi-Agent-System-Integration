services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "127.0.0.1:${WS_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/state', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_GAME_URL: ${VITE_GAME_URL:-/unity/Build}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    volumes:
      - ./unity-build:/usr/share/nginx/html/unity:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/backend/api/state"]
      interval: 5s
      timeout: 4s
      retries: 12
